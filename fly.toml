app = "uniquel-bags"
primary_region = "ams"

[build]

[env]
  APP_URL = "https://uniquel-bags.fly.dev"
  DATA_DIR = "/data"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "8080"
  VINEXT_TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "uniquel_bags_data"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 5
